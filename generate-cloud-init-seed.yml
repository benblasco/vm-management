---
# Role test harness — exercises generate-cloud-init-iso without creating a VM.
# Production VM lifecycle: libvirt-createvm.yml (includes this role) and libvirt-deletevm.yml.
#
# Renders user-data and network-config (when vm_ip_address is set) and runs cloud-localds
# on the hypervisor. For static IP you must pass vm_mac_address (from virsh dumpxml or a test MAC).
#
# DHCP / no static IP:
#
#   ansible-playbook generate-cloud-init-seed.yml --ask-become-pass \
#     -e hypervisor_host=nuc.lan \
#     -e vm_hostname=my-rhis-vm
#
# Static IP:
#
#   ansible-playbook generate-cloud-init-seed.yml --ask-become-pass \
#     -e hypervisor_host=nuc.lan \
#     -e vm_hostname=my-rhis-vm \
#     -e vm_ip_address=192.168.140.99 \
#     -e vm_ip_prefix=22 \
#     -e vm_ip_gateway=192.168.140.1 \
#     -e 'vm_ip_nameservers=["192.168.1.3","192.168.1.7"]' \
#     -e vm_mac_address=52:54:00:12:34:56
#
# Attach the ISO via libvirt-createvm.yml in normal use; this playbook only rebuilds the seed file.

- name: Generate a cloud-init seed ISO on the hypervisor
  hosts: "{{ hypervisor_host | default('all') }}"
  become: true

  vars_files:
    - vars/vm_image.yml
    - defaults/main.yml

  roles:
    - role: generate-cloud-init-iso
